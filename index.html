<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Calcul impact sonore</title>
</head>
<body>

<h1>Calcul d'impact sonore</h1>

<label>Type d'entrée :</label>
<select id="inputType">
  <option value="lw">Puissance acoustique (Lw)</option>
  <option value="lp">Niveau à distance (Lp)</option>
</select>

<br><br>

<label>Valeur (dB) :</label>
<input type="number" id="value">

<br><br>

<label>Distance (m) :</label>
<input type="number" id="distance">

<br><br>

<label>Mode de calcul :</label>
<select id="mode">
  <option value="level">Calculer niveau</option>
  <option value="distance">Calculer distance</option>
</select>

<br><br>

<label>Niveau cible (dB) :</label>
<input type="number" id="target">

<br><br>

<button onclick="calculate()">Calculer</button>

<h2 id="result"></h2>

<script src="script.js"></script>
</body>
</html>
